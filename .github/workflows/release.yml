# Builds the installers and publishes the Release when a vX.Y.Z tag is pushed.
# Full process in docs/releasing.md.
#
# Also runs — build jobs only, never the publish job — on PRs that touch
# packaging and on manual dispatch (Actions → Release → Run workflow). The
# installers are kept as workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "src/farejador/__init__.py"
      - "src/farejador/__main__.py"
      - "src/farejador/desktop.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: tag matches __version__
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/farejador/__init__.py)" >> "$GITHUB_OUTPUT"
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.v.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ (v${{ steps.v.outputs.version }})."
            exit 1
          fi

  build-macos:
    name: macOS (${{ matrix.arch }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }      # Apple Silicon
          - { runner: macos-15-intel, arch: x86_64 }   # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: packaging/build-macos.sh
      - name: Smoke test — the .app starts and serves the dashboard
        run: |
          set -e
          export FAREJADOR_DATA_DIR="$PWD/smoke-data"
          dist/Farejador.app/Contents/MacOS/Farejador &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/sources > page.html && break
            sleep 2
          done
          grep -q 'name="interval_seconds"' page.html || { echo "::error::settings form missing"; head -50 page.html; exit 1; }
          sleep 5
          echo "--- app.log ---"; cat smoke-data/app.log
          if grep -qE "Traceback|ModuleNotFoundError" smoke-data/app.log; then echo "::error::errors in app.log"; exit 1; fi
          kill $APP_PID || true
      - uses: actions/upload-artifact@v7
        with:
          name: Farejador-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows (x64)
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: packaging\build-windows.bat
        shell: cmd
      - name: Smoke test — the .exe starts and serves the dashboard
        shell: pwsh
        run: |
          $env:FAREJADOR_DATA_DIR = "$PWD\smoke-data"
          $exe = (Get-ChildItem dist\Farejador-*-Windows-x64.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/sources -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Write-Error "dashboard never came up"; exit 1 }
          if ($r.Content -notmatch 'name="interval_seconds"') { Write-Error "settings form missing"; exit 1 }
          Start-Sleep -Seconds 5
          Write-Host "--- app.log ---"; Get-Content smoke-data\app.log
          if (Select-String -Path smoke-data\app.log -Pattern "Traceback|ModuleNotFoundError" -Quiet) { Write-Error "errors in app.log"; exit 1 }
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v7
        with:
          name: Farejador-Windows-x64
          path: dist/Farejador-*-Windows-x64.exe
          if-no-files-found: error

  release:
    name: publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check-version, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG
        run: python3 scripts/changelog_section.py "${{ needs.check-version.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          name: Farejador ${{ needs.check-version.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: artifacts/*
