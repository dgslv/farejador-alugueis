name: Build Desktop Apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt

      - name: Build .app bundle
        run: pyinstaller aluguel.spec --clean --noconfirm

      - name: Create .dmg
        run: |
          hdiutil create \
            -volname "Aluguel" \
            -srcfolder "dist/Aluguel.app" \
            -ov -format UDZO \
            "dist/Aluguel.dmg"

      - name: Smoke test .app (dashboard up, no import errors)
        run: |
          set -e
          dist/Aluguel.app/Contents/MacOS/Aluguel &
          APP_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/sources > page.html && break
            sleep 2
          done
          grep -q 'name="interval_seconds"' page.html || { echo "settings form missing"; cat page.html | head -50; exit 1; }
          LOG="$HOME/Library/Application Support/Aluguel/app.log"
          sleep 5
          if grep -qE "Traceback|ModuleNotFoundError" "$LOG"; then echo "errors in app.log:"; cat "$LOG"; exit 1; fi
          echo "--- app.log ---"; cat "$LOG"
          kill $APP_PID || true

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aluguel-Mac
          path: dist/Aluguel.dmg
          retention-days: 30

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-desktop.txt

      - name: Build .exe
        run: pyinstaller aluguel_windows.spec --clean --noconfirm

      - name: Smoke test .exe (dashboard up, no import errors)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Aluguel.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/sources -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $ok) { Write-Error "dashboard never came up"; exit 1 }
          if ($r.Content -notmatch 'name="interval_seconds"') { Write-Error "settings form missing"; exit 1 }
          Start-Sleep -Seconds 5
          $log = Join-Path $env:APPDATA "Aluguel\app.log"
          Write-Host "--- app.log ---"; Get-Content $log
          if (Select-String -Path $log -Pattern "Traceback|ModuleNotFoundError" -Quiet) { Write-Error "errors in app.log"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aluguel-Windows
          path: dist\Aluguel.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    # Only run when a version tag is pushed (e.g. v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: Aluguel-Mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Aluguel-Windows
          path: artifacts/windows

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mac/Aluguel.dmg
            artifacts/windows/Aluguel.exe
          generate_release_notes: true
