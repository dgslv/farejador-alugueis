# Notas de release geradas automaticamente pelo GitHub, agrupadas pelas labels dos PRs.
# Docs: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ⚠️ Mudanças incompatíveis
      labels: [breaking]
    - title: ✨ Novidades
      labels: [enhancement]
    - title: 🐛 Correções
      labels: [bug]
    - title: 📚 Documentação
      labels: [documentation]
    - title: 🔧 Build, CI e dependências
      labels: [ci, dependencies]
    - title: Outras mudanças
      labels: ["*"]
