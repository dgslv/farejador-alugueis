# Runs lint and formatting before every commit. Install once with: pre-commit install
# Same ruff as the CI (see .github/workflows/ci.yml).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
