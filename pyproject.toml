# Configuração das ferramentas de desenvolvimento.
# As dependências ficam em requirements*.txt (o app não é publicado no PyPI).

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["backend", "build", "dist"]

[tool.ruff.lint]
# E/W: estilo (pycodestyle) · F: erros (pyflakes) · I: ordem dos imports
# B: bugs prováveis (bugbear) · UP: sintaxe moderna (pyupgrade)
select = ["E", "F", "W", "I", "B", "UP"]
# O HTML do dashboard vive em strings Python; limitar o comprimento das linhas
# ali só piora a leitura.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
