[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "farejador"
description = "Watches VivaReal rental searches and notifies you when a new apartment fits your budget. Desktop app for macOS and Windows."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Diego Silva" }]
requires-python = ">=3.9"
dynamic = ["version"]
keywords = ["aluguel", "apartamentos", "vivareal", "scraper", "playwright", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "playwright>=1.44",
  "playwright-stealth>=2.0",
  "flask>=3.0",
  "plyer>=2.1",
  "pywebview>=5.0",
]

[project.optional-dependencies]
# Desktop app packaging (.app / .exe)
desktop = [
  "pyinstaller>=6.0",
  "pillow>=10.0",
  "pyobjc-framework-UserNotifications>=10; sys_platform == 'darwin'",
]
# Development: tests, lint, hooks
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "pre-commit>=3.0",
]

[project.scripts]
farejador = "farejador.__main__:main"

[project.urls]
Homepage = "https://github.com/dgslv/farejador-alugueis"
Changelog = "https://github.com/dgslv/farejador-alugueis/blob/main/CHANGELOG.md"
Issues = "https://github.com/dgslv/farejador-alugueis/issues"

[tool.setuptools.dynamic]
version = { attr = "farejador.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
farejador = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# E/W: style (pycodestyle) · F: errors (pyflakes) · I: import order
# B: likely bugs (bugbear) · UP: modern syntax (pyupgrade)
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
