<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Farejador de Aluguéis — ícone. Fonte única: gere PNG/ICNS/ICO com scripts/make-icons.py -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cbf60"/>
      <stop offset="1" stop-color="#1b5e20"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo: quadrado arredondado no estilo macOS (824 px em canvas de 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- casa -->
  <g fill="#ffffff">
    <rect x="640" y="356" width="52" height="150" rx="6"/>                <!-- chaminé -->
    <polygon points="512,286 244,548 780,548"/>                            <!-- telhado -->
    <path d="M322 548 H702 V736 a28 28 0 0 1 -28 28 H350 a28 28 0 0 1 -28 -28 Z"/> <!-- corpo -->
  </g>

  <!-- pata do farejador, em negativo -->
  <g fill="#1f6b24">
    <ellipse cx="512" cy="676" rx="66" ry="54"/>
    <circle cx="446" cy="602" r="31"/>
    <circle cx="487" cy="563" r="32"/>
    <circle cx="537" cy="563" r="32"/>
    <circle cx="578" cy="602" r="31"/>
  </g>
</svg>
